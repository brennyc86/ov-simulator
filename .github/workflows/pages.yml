name: Site publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Data-tak ophalen (als die er al is)
        run: |
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch -q --depth 1 origin data
            mkdir -p data && git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
          else
            echo "Nog geen data-tak; site gaat live zonder kaartdata"
          fi
          du -sh data || true
      - name: Site samenstellen en naar gh-pages (zonder geschiedenis)
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          [ -d data ] && cp -r data _site/ || true
          # versie: datum en tijd van publiceren (NL-tijd), commit, aantal commits en laatste wijziging
          N=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          printf '{"versie":"%s","datum":"%s","commit":"%s","wijziging":%s}\n' "1.$N" "$(TZ=Europe/Amsterdam date +'%d-%m-%Y %H:%M')" "${GITHUB_SHA::7}" "$(git log -1 --pretty=%s | head -c 160 | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')" > _site/versie.json
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "ov-simulator site"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Site $(date -u +%FT%TZ) (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
