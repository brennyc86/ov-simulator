name: Wegen ophalen
# Haalt de autowegen (rijstroken, stoepen, verhard/onverhard) per vak van 10 km op.
# Al opgehaalde vakken worden overgeslagen, dus herhaald draaien vult heel Nederland stap voor stap.
on:
  workflow_dispatch:
    inputs:
      gebied:
        description: "gooi, regio of nl"
        default: "nl"
  schedule:
    - cron: "17 3 * * 0"
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  wegen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Vorige data ophalen
        run: |
          mkdir -p uit && cd uit
          git init -q
          git fetch -q --depth 1 "https://github.com/${{ github.repository }}" data && git checkout -q FETCH_HEAD -- .
          rm -rf .git
      - name: Wegen ophalen
        run: python3 tools/wegen.py --gebied "${{ inputs.gebied || 'nl' }}" --uit uit/wegen --pauze 2 --max-minuten 300
      - name: Naar de data-tak
        run: |
          cd uit
          git init -q -b data
          git config user.name "ov-simulator data"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Wegen $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
      - name: Site opnieuw publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches -d '{"ref":"main"}'
