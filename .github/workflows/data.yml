name: Kaartdata en dienstregeling verversen

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # elke 1e van de maand

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  # De dienstregeling en OpenStreetMap lopen naast elkaar: als Overpass traag is of faalt,
  # komt de dienstregeling toch online, en blijft de vorige kaartdata staan.
  gtfs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GTFS downloaden
        run: curl -sSfL -A "ov-simulator-datapijplijn" -o /tmp/gtfs.zip https://gtfs.ovapi.nl/nl/gtfs-nl.zip
      - name: GTFS omzetten (lijnen, haltes, vertrektijden)
        run: python3 tools/gtfs.py --zip /tmp/gtfs.zip --uit uit
      - name: België en Luxemburg (NMBS, MIVB, De Lijn, TEC, Luxemburg)
        run: |
          set +e
          for bron in "sncb BE https://data.gtfs.be/sncb/gtfs/be-sncb-gtfs.zip" "stib BE https://data.gtfs.be/stib/gtfs/be-stib-gtfs.zip" \
                      "delijn BE https://data.gtfs.be/delijn/gtfs/be-delijn-gtfs.zip" "tec BE https://data.gtfs.be/tec/gtfs/be-tec-gtfs.zip"; do
            set -- $bron
            curl -sSfL -A "ov-simulator-datapijplijn" -o /tmp/$1.zip "$3" && python3 tools/gtfs.py --zip /tmp/$1.zip --uit uit --toevoegen --land $2 || echo "$1 mislukt, overgeslagen"
            rm -f /tmp/$1.zip
          done
          LU=$(curl -sS https://data.public.lu/api/1/datasets/horaires-et-arrets-des-transport-publics-gtfs/ | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d['resources'], key=lambda r: r.get('last_modified') or '')[-1]['url'])")
          curl -sSfL -A "ov-simulator-datapijplijn" -o /tmp/lu.zip "$LU" && python3 tools/gtfs.py --zip /tmp/lu.zip --uit uit --toevoegen --land LU || echo "Luxemburg mislukt, overgeslagen"
          exit 0
      - name: Duitsland en Frankrijk, treinen (DB Fern- en Regionalverkehr via gtfs.de, SNCF TGV, Intercités en TER)
        run: |
          set +e
          for bron in "defv DE https://download.gtfs.de/germany/fv_free/latest.zip" \
                      "tgv FR https://eu.ftp.opendatasoft.com/sncf/gtfs/export_gtfs_voyages.zip" \
                      "ic FR https://eu.ftp.opendatasoft.com/sncf/gtfs/export-intercites-gtfs-last.zip" \
                      "derv DE https://download.gtfs.de/germany/rv_free/latest.zip" \
                      "ter FR https://eu.ftp.opendatasoft.com/sncf/gtfs/export-ter-gtfs-last.zip"; do
            set -- $bron
            curl -sSfL -A "ov-simulator-datapijplijn" -o /tmp/$1.zip "$3" && python3 tools/gtfs.py --zip /tmp/$1.zip --uit uit --toevoegen --land $2 || echo "$1 mislukt, overgeslagen"
            rm -f /tmp/$1.zip
          done
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: gtfs
          path: uit

  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # NL, BE, LU volledig + het landelijke spoornet van DE en FR (in stukken)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenStreetMap (spoor, stations, wissels, plaatsen, veren, vliegvelden; NL, BE, LU, DE, FR)
        run: |
          python3 -u tools/osm.py --uit uit
          python3 -u tools/ohm.py --uit uit || echo "OpenHistoricalMap mislukt, vorige versie blijft"
          python3 -u tools/polders.py --uit uit || echo "polders mislukt, vorige versie blijft"
      - uses: actions/upload-artifact@v4
        with:
          name: osm
          path: uit

  samenvoegen:
    needs: [gtfs, osm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Vorige data ophalen
        run: |
          mkdir -p uit && cd uit
          git init -q
          if git fetch -q --depth 1 "https://github.com/${{ github.repository }}" data 2>/dev/null; then
            git checkout -q FETCH_HEAD -- . && echo "vorige data opgehaald"
          fi
          rm -rf .git
      - uses: actions/download-artifact@v4
        if: needs.gtfs.result == 'success'
        with:
          name: gtfs
          path: nieuw-gtfs
      - uses: actions/download-artifact@v4
        if: needs.osm.result == 'success'
        with:
          name: osm
          path: nieuw-osm
      - name: Samenvoegen en naar de data-tak (zonder geschiedenis)
        run: |
          if [ -d nieuw-gtfs ]; then rm -rf uit/lijnen; cp -r nieuw-gtfs/. uit/; echo "dienstregeling bijgewerkt"; fi
          if [ -d nieuw-osm ]; then cp -r nieuw-osm/. uit/; echo "kaartdata bijgewerkt"; fi
          echo "gtfs=${{ needs.gtfs.result }} osm=${{ needs.osm.result }}"
          du -sh uit; ls -la uit | head -30
          cd uit
          date -u +"%Y-%m-%dT%H:%MZ" > bijgewerkt.txt
          git init -q -b data
          git config user.name "ov-simulator data"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date -u +%F) (gtfs ${{ needs.gtfs.result }}, osm ${{ needs.osm.result }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
      - name: Site opnieuw publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
